#
# Runs the standard gate of IMPLEMENTATION.md section 1 plus the documentation
# build and a coverage report. The repository must build without docs/spec/
# (the licensed standards and the IEC code components are not present in CI).

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: standard gate (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sibling repository (path dependencies)
        uses: ./.github/actions/sibling-checkout
        with:
          token: ${{ secrets.SIBLING_REPO_TOKEN || github.token }}

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-llvm-cov

      - name: Format
        # Our packages only: the sibling repository is formatted by its own gate.
        run: cargo fmt -p igs-iec61850-mms-core -p igs-iec61850-mms -p xtask -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --all-features

      - name: Tests
        run: cargo test --workspace --all-features

      - name: Examples
        run: cargo build --workspace --examples --all-features

      - name: Coverage (report only)
        run: cargo llvm-cov --workspace --all-features --summary-only

      - name: Deny
        run: cargo deny check

  msrv:
    name: minimum supported Rust version (1.85)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sibling repository (path dependencies)
        uses: ./.github/actions/sibling-checkout
        with:
          token: ${{ secrets.SIBLING_REPO_TOKEN || github.token }}

      - name: Install the toolchain
        run: rustup toolchain install 1.85 --profile minimal

      # rust-toolchain.toml pins stable, so the toolchain is named on the command line.
      - name: Tests
        run: cargo +1.85 test --workspace --all-features

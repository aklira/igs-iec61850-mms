# Rule 9 of IMPLEMENTATION.md: MIT, Apache-2.0, BSD or ISC only. An exception is recorded in PROVENANCE.md.

[graph]
all-features = true

[advisories]
version = 2

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    # unicode-ident, reached through the derive macros of the MMS stack: Unicode data tables, permissive (as in
    # igs-iso9506-mms, PROVENANCE.md). Recorded as D-011.
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

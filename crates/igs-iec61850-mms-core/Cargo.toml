[package]
name = "igs-iec61850-mms-core"
version = "0.1.3"
description = "Sans-I/O core of IEC 61850 over MMS: object references, ACSI types and their MMS mapping, model, service state machines."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true

[lints]
workspace = true

[features]
# The SCL parser (IEC 61850-6, task S1). Off by default: the sans-I/O model does not need it.
scl = ["dep:roxmltree"]

[dependencies]
# roxmltree 0.21 (MIT OR Apache-2.0, no dependency): the read-only XML tree of the SCL parser (task S1, D-018).
roxmltree = { version = "0.21", optional = true }
# The MMS codec of igs-iso9506-mms: the MMS values and type descriptions the ACSI types map to (task A2).
igs-iso9506-mms-codec = { path = "../../../igs-iso9506-mms/crates/igs-iso9506-mms-codec", version = "1.2.0" }

[dev-dependencies]
# proptest: the property tests of the names and the references (task A1), as in the MMS codec (MIT or Apache-2.0).
proptest = { version = "1", default-features = false, features = ["std"] }


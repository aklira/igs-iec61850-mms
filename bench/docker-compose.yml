#
# Interop bench. The reference peer runs as separate containers and is used as a black box only
# (IMPLEMENTATION.md, rule 1). Fixed addresses: the client is given the server address.

x-peer: &peer
  image: localhost/igs61850-peer:v1.6.2.1
  build:
    context: ./peer

services:
  # An example IEC 61850 server of the peer. REF_SERVER selects another example binary of the image
  # (for instance server_example_control); the default is the basic input/output device.
  ref-server:
    <<: *peer
    command: ["${REF_SERVER:-server_example_basic_io}"]
    # Published on the loopback only, so that the stacks run on the host can reach it.
    ports:
      - "127.0.0.1:11102:102"
    networks:
      bench:
        ipv4_address: 172.31.103.10

  ref-client:
    <<: *peer
    command: ["sleep", "infinity"]
    networks:
      bench:
        ipv4_address: 172.31.103.21

  # Shares the network namespace of the reference server, so that it sees every frame the server
  # sends and receives. tcpdump writes packet by packet to captures/$BENCH_CAPTURE; the container
  # outlives it so that the helpers can stop it and then run tshark with `exec`.
  capture:
    image: docker.io/nicolaka/netshoot@sha256:a20c2531bf35436ed3766cd6cfe89d352b050ccc4d7005ce6400adf97503da1b
    network_mode: "service:ref-server"
    depends_on:
      - ref-server
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      BENCH_CAPTURE: ${BENCH_CAPTURE:-bench.pcap}
    command:
      - sh
      - -c
      - tcpdump -i any -U --immediate-mode -Z root -w "/captures/$$BENCH_CAPTURE" tcp port 102 & exec sleep infinity
    volumes:
      - ./captures:/captures

  # The reverse rows (task A7): our server, and the reference clients and a capture in its network namespace. Started
  # with the profile `ours` only, so that the rows of the reference servers are unaffected.
  our-server:
    profiles: ["ours"]
    build:
      context: ./ours
    image: localhost/igs61850-ours:latest
    command: ["igs61850-server", "--listen", "0.0.0.0:102"]
    networks:
      bench:
        ipv4_address: 172.31.103.30

  ref-client-ours:
    <<: *peer
    profiles: ["ours"]
    network_mode: "service:our-server"
    command: ["sleep", "infinity"]
    depends_on:
      - our-server

  ours-capture:
    profiles: ["ours"]
    image: docker.io/nicolaka/netshoot@sha256:a20c2531bf35436ed3766cd6cfe89d352b050ccc4d7005ce6400adf97503da1b
    network_mode: "service:our-server"
    depends_on:
      - our-server
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      BENCH_CAPTURE: ${BENCH_CAPTURE:-bench.pcap}
    command:
      - sh
      - -c
      - tcpdump -i any -U --immediate-mode -Z root -w "/captures/$$BENCH_CAPTURE" tcp port 102 & exec sleep infinity
    volumes:
      - ./captures:/captures

networks:
  bench:
    ipam:
      config:
        - subnet: 172.31.103.0/24
